name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Next version
        id: ver
        run: |
          TAG=$(sh scripts/next-version.sh)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "next tag: $TAG"
      - name: Build artifacts
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: make dist
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES=$(mktemp)
          if ! gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ github.sha }}" \
              --jq .body >"$NOTES"; then
            printf 'Release %s\n' "$TAG" >"$NOTES"
          fi
          shopt -s nullglob
          files=(dist/md2c_"${TAG}"_* dist/SHA256SUMS)
          if [ "${#files[@]}" -lt 5 ]; then
            echo "expected 4 binaries + SHA256SUMS, got: ${files[*]:-none}" >&2
            ls -l dist >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --draft=false --latest --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --target "${{ github.sha }}"
          fi
